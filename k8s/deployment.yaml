apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumina-api
  labels:
    app: lumina-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lumina-api
  template:
    metadata:
      labels:
        app: lumina-api
    spec:
      containers:
        - name: lumina-api
          image: lumina-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
